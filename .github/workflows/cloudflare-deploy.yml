name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # Baked into apps/web/wrangler.toml; needed at build time for Next.js client bundle.
  NEXT_PUBLIC_API_URL: https://food-ingredients-api.osohoo691016.workers.dev
  NEXT_PUBLIC_R2_PUBLIC_BASE_URL: https://pub-10e5fb7fa4594b528d76dcc4cc0272a4.r2.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN."
            echo "Create a token at https://dash.cloudflare.com/profile/api-tokens"
            echo "Use the 'Edit Cloudflare Workers' template, then add it under"
            echo "GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Apply additive D1 recipe metadata migration
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/api
          wranglerVersion: "4"
          packageManager: pnpm
          command: d1 execute food-ingredients --remote --file=db/0007_recipe_metadata.sql --yes

      - name: Apply additive D1 authentication rate limit migration
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/api
          wranglerVersion: "4"
          packageManager: pnpm
          command: d1 execute food-ingredients --remote --file=db/0008_auth_rate_limits.sql --yes

      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/api
          wranglerVersion: "4"
          packageManager: pnpm
          command: deploy

      - name: Build frontend (next-on-pages)
        run: pnpm --filter web run pages:build

      - name: Deploy frontend Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/web
          wranglerVersion: "4"
          packageManager: pnpm
          command: deploy
