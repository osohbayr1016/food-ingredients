name: Validate pull requests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Database migration smoke test
        run: python3 apps/api/tests/schema_smoke.py
      - name: Pure API unit tests
        run: node --experimental-strip-types --test apps/api/tests/recipe_safety.test.mjs
      - name: Recipe payload boundary and metadata validation tests
        run: node --experimental-strip-types --test apps/api/tests/recipe-payload-boundaries.test.mjs
      - name: Recipe media integrity tests
        run: node --experimental-strip-types --test apps/api/tests/recipe-media-validation.test.mjs
      - name: Pantry quantity allocation tests
        run: node --experimental-strip-types --test apps/api/tests/pantry_matching.test.mjs
      - name: Editorial publication-queue tests
        run: node --experimental-strip-types --test apps/api/tests/publication_queue.test.mjs
      - name: Bilingual recipe search tests
        run: node --experimental-strip-types --test apps/api/tests/recipe-search.test.mjs
      - name: Primary navigation UX tests
        run: node --experimental-strip-types --test apps/web/tests/primary-navigation.test.mjs
      - name: Signed JWT session version tests
        run: node --experimental-strip-types --test apps/api/tests/jwt-session.test.mjs
      - name: Account pantry validation tests
        run: node --experimental-strip-types --test apps/api/tests/pantry-sync.test.mjs
      - name: Account meal plan snapshot validation tests
        run: node --experimental-strip-types --test apps/api/tests/meal-plan-sync.test.mjs
      - name: Bounded account JSON and complete data export tests
        run: node --experimental-strip-types --test apps/api/tests/bounded-json-and-export.test.mjs
      - name: Pantry inventory unit tests
        run: node --experimental-strip-types --test apps/web/tests/pantry-inventory.test.mjs
      - name: Account-deletion rate limit policy tests
        run: node --experimental-strip-types --test apps/api/tests/auth-limits.test.mjs
      - name: Cross-origin allowlist validation tests
        run: node --experimental-strip-types --test apps/api/tests/cors-policy.test.mjs
      - name: Private local-data export allowlist tests
        run: node --experimental-strip-types --test apps/web/tests/browser-data-export.test.mjs
      - name: Auth migration and password hash safety
        run: node --experimental-strip-types --test apps/api/tests/password-safety.test.mjs
      - name: Safe auth inputs and login redirects
        run: |
          node --experimental-strip-types --test apps/api/tests/auth-input.test.mjs
          node --experimental-strip-types --test apps/web/tests/safe-redirect.test.mjs
      - name: Guest favorites validation tests
        run: node --experimental-strip-types --test apps/api/tests/guest-likes.test.mjs
      - name: Recipe request and upload path validation tests
        run: node --experimental-strip-types --test apps/api/tests/request-validation.test.mjs
      - name: Bounded image streaming and signature tests
        run: node --experimental-strip-types --test apps/api/tests/image-body-validation.test.mjs
      - name: R2 presigned exact-size signature tests
        run: node --experimental-strip-types --test apps/api/tests/presigned-image-policy.test.mjs
      - name: Editorial import and tag input tests
        run: node --experimental-strip-types --test apps/api/tests/editorial-inputs.test.mjs
      - name: Strict public recipe-filter tests
        run: node --experimental-strip-types --test apps/api/tests/recipe-filters.test.mjs
      - name: Stable recipe sorting tests
        run: node --experimental-strip-types --test apps/api/tests/recipe-sort.test.mjs
      - name: Cooking session resume tests
        run: node --experimental-strip-types --test apps/web/tests/cooking-session.test.mjs
      - name: Reusable cooking timer alerts
        run: node --experimental-strip-types --test apps/web/tests/cooking-timer-alert.test.mjs
      - name: Quick weekly meal-planning tests
        run: node --experimental-strip-types --test apps/web/tests/quick-meal-plan.test.mjs
      - name: Weekly calendar export tests
        run: node --experimental-strip-types --test apps/web/tests/calendar-export.test.mjs
      - name: Browser meal planner legacy storage validation
        run: node --experimental-strip-types --test apps/web/tests/meal-planner-storage.test.mjs
      - name: Pantry cloud merge tests
        run: node --experimental-strip-types --test apps/web/tests/pantry-merge.test.mjs
      - name: Meal-shopping arithmetic tests
        run: node --experimental-strip-types --test apps/web/tests/meal-shopping.test.mjs
      - name: Source-backed recipe nutrition metadata tests
        run: node --experimental-strip-types --test apps/web/tests/recipe-nutrition-evidence.test.mjs
      - name: Accessible carousel motion policy tests
        run: node --experimental-strip-types --test apps/web/tests/carousel-motion.test.mjs
      - name: Recipe recommendation sorting tests
        run: node --experimental-strip-types --test apps/web/tests/suggest-sort.test.mjs
      - name: Near-ready pantry recipe discovery tests
        run: node --experimental-strip-types --test apps/web/tests/near-ready-recipes.test.mjs
      - name: Production smoke runner syntax
        run: node --check scripts/smoke-production.mjs
      - name: API typecheck
        run: pnpm --filter api exec tsc --noEmit
      - name: API Wrangler dry-run bundle
        run: pnpm --filter api exec wrangler deploy --dry-run
      - name: Web typecheck
        run: pnpm --filter web exec tsc --noEmit
      - name: Web lint
        run: pnpm --filter web lint
      - name: Production frontend build
        run: pnpm --filter web run pages:build
