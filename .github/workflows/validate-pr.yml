name: Validate pull requests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Database migration smoke test
        run: python3 apps/api/tests/schema_smoke.py
      - name: Pure API unit tests
        run: node --experimental-strip-types --test apps/api/tests/recipe_safety.test.mjs
      - name: Pantry quantity allocation tests
        run: node --experimental-strip-types --test apps/api/tests/pantry_matching.test.mjs
      - name: Pantry inventory unit tests
        run: node --experimental-strip-types --test apps/web/tests/pantry-inventory.test.mjs
      - name: Meal-shopping arithmetic tests
        run: node --experimental-strip-types --test apps/web/tests/meal-shopping.test.mjs
      - name: Recipe recommendation sorting tests
        run: node --experimental-strip-types --test apps/web/tests/suggest-sort.test.mjs
      - name: API typecheck
        run: pnpm --filter api exec tsc --noEmit
      - name: API Wrangler dry-run bundle
        run: pnpm --filter api exec wrangler deploy --dry-run
      - name: Web typecheck
        run: pnpm --filter web exec tsc --noEmit
      - name: Web lint
        run: pnpm --filter web lint
      - name: Production frontend build
        run: pnpm --filter web run pages:build
