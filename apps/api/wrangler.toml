account_id = "aabe952df5d4e4b780339bf3b4217ed7"
name = "food-ingredients-api"
main = "src/index.ts"
compatibility_date = "2025-05-06"
compatibility_flags = ["nodejs_compat"]

# 00:20 UTC daily = 08:20 Ulaanbaatar. Trigger runs on Cloudflare, no server required.
[triggers]
crons = ["20 0 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "food-ingredients"
database_id = "350cde30-5ddf-4c92-a30c-8cd4e3375c83"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "food-ingredients-images"

[vars]
# Import disabled unless explicitly enabled after licensing and production-key review.
AUTO_IMPORT_ENABLED = "false"
PUBLIC_ORIGINS = "http://localhost:3000,http://127.0.0.1:3000,https://food-ingredients-web.pages.dev,https://food-ingredients-web.osohoo691016.workers.dev"
R2_PUBLIC_BASE_URL = "https://pub-10e5fb7fa4594b528d76dcc4cc0272a4.r2.dev"
R2_BUCKET_NAME = "food-ingredients-images"
# ADMIN_SECRET, JWT_SECRET, THEMEALDB_API_KEY and R2 credentials MUST be set as Wrangler secrets in production.
